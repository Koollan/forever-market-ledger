name: CI
on:
  pull_request:
  push:
    branches-ignore: [main] # main is checked by the Pages workflow before it deploys
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser tests
        run: npm run test:e2e
      - name: Upload screenshots and report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: screens-and-report
          path: |
            test-results/
            playwright-report/
          retention-days: 14
